<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoGO - Bike Rental</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loading Screen -->
  <div class="loader">
    <div class="loader-bike">🚲</div>
    <p>Loading MotoGO...</p>
  </div>

  <header class="navbar">
    <a href="Home.html" class="logo">Moto<span>GO</span></a>

    <ul class="nav-links" id="navLinks">
      <li><a href="Home.html" class="active">Home</a></li>
      <li><a href="bikes.html">Bikes</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- React will put the home page content inside this div -->
  <main id="root"></main>

  <footer>
    <p>&copy; 2026 MotoGO Bike Rentals</p>
    <p>Made by Team MotoGO | Chitkara University</p>
  </footer>

  <!-- React, ReactDOM and Babel (loaded from CDN, no installation needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    // useState is a React "hook" used to store data inside a component
    const { useState } = React;

    // ===== Data (arrays of objects) =====
    const features = [
      { id: "01", title: "Easy Booking", text: "Choose your bike and fill a simple booking form." },
      { id: "02", title: "Student Friendly", text: "Simple plans and affordable hourly rental prices." },
      { id: "03", title: "Good Bikes", text: "Our bikes are checked before they are given for a ride." }
    ];

    const steps = [
      { number: 1, title: "Select a bike", text: "Choose Mountain, Sports or Electric." },
      { number: 2, title: "Pick your dates", text: "Select pickup and return dates." },
      { number: 3, title: "Confirm booking", text: "Submit the form and get your ride." }
    ];

    // ===== Component 1: Hero =====
    function Hero() {
      // read the logged in user from localStorage (saved by login page)
      const [user] = useState(function () {
        const data = localStorage.getItem("motogoCurrentUser");
        return data ? JSON.parse(data) : null;
      });

      return (
        <section className="hero">
          <div className="hero-text">
            <p className="small-title">SIMPLE • AFFORDABLE • EASY</p>
            {user && <p className="small-title">WELCOME BACK, {user.name.toUpperCase()}!</p>}
            <h1>Rent a Bike.<br />Ride the City.</h1>
            <p className="hero-description">
              Need a bike for college, a short trip or a weekend ride?
              Choose a bike, select your dates and start your ride.
            </p>
            <a href="bikes.html" className="btn-primary">Browse Bikes</a>
          </div>

          <div className="hero-img">
            <img src="Images/motogo.png" alt="Bike for rent" />
          </div>
        </section>
      );
    }

    // ===== Component 2: one feature card (receives data using props) =====
    function FeatureCard(props) {
      return (
        <div className="card">
          <div className="card-icon">{props.id}</div>
          <h3>{props.title}</h3>
          <p>{props.text}</p>
        </div>
      );
    }

    // ===== Component 3: Features section =====
    function Features() {
      return (
        <section className="features">
          <div className="section-title">
            <p className="small-title">WHY MOTOGO?</p>
            <h2>Everything you need for an easy ride</h2>
          </div>

          <div className="feature-cards">
            {features.map(function (item) {
              return <FeatureCard key={item.id} id={item.id} title={item.title} text={item.text} />;
            })}
          </div>
        </section>
      );
    }

    // ===== Component 4: one step =====
    function Step(props) {
      return (
        <div className="step">
          <div className="step-number">{props.number}</div>
          <h3>{props.title}</h3>
          <p>{props.text}</p>
        </div>
      );
    }

    // ===== Component 5: Steps section =====
    function Steps() {
      return (
        <section className="steps">
          <div className="section-title">
            <p className="small-title">HOW IT WORKS</p>
            <h2>Three simple steps</h2>
          </div>

          <div className="steps-container">
            {steps.map(function (item) {
              return <Step key={item.number} number={item.number} title={item.title} text={item.text} />;
            })}
          </div>
        </section>
      );
    }

    // ===== Main App component =====
    function App() {
      return (
        <div>
          <Hero />
          <Features />
          <Steps />
        </div>
      );
    }

    // show the App inside <main id="root">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <!-- Normal JavaScript (navbar, login/logout, menu) -->
  <script src="script.js"></script>
</body>
</html>
