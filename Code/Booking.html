<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Bike - MotoGO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Moto<span>GO</span></a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="bikes.html">Bikes</a></li>
      <li><a href="booking.html" class="active">Booking</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main>
    <section class="page-heading">
      <p class="small-title">BOOK YOUR RIDE</p>
      <h1>Bike Booking</h1>
      <p>Fill in the details below to reserve your bike.</p>
    </section>

    <section class="form-section">
      <form id="bookingForm" class="main-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <span class="error" id="nameError"></span>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <span class="error" id="emailError"></span>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10 digit mobile number" maxlength="10">
        <span class="error" id="phoneError"></span>

        <label for="bikeType">Choose Bike Type</label>
        <select id="bikeType">
          <option value="">-- Select Bike --</option>
          <option value="mountain">Mountain Bike</option>
          <option value="sports">Sports Bike</option>
          <option value="electric">Electric Bike</option>
        </select>
        <span class="error" id="bikeError"></span>

        <div class="date-row">
          <div>
            <label for="pickupDate">Pickup Date</label>
            <input type="date" id="pickupDate">
          </div>
          <div>
            <label for="returnDate">Return Date</label>
            <input type="date" id="returnDate">
          </div>
        </div>
        <span class="error" id="dateError"></span>

        <button type="submit" class="btn-primary form-button">Confirm Booking</button>
        <p id="successMsg" class="success-msg"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MotoGO Bike Rentals</p>
    <p>Made by Team MotoGO | Chitkara University</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
